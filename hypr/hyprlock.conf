# ==============================================================================
#  MrDemonc-SHELL: Hyprlock Configuration
#  Estilo y paleta Catppuccin Mocha coordinado con Quickshell & Hyprland
# ==============================================================================

# Cargar colores dinámicos del tema activo de la Shell
source = ~/.config/hypr/hyprlock_colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# 1. Fondo con desenfoque elegante de la pantalla activa (efecto cristal esmerilado)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.80
    vibrancy = 0.20
    vibrancy_darkness = 0.0
    color = $bg
}

# 2. Reloj digital principal
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 76
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# 3. Fecha completa
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B %Y")"
    color = $subtext
    font_size = 15
    font_family = JetBrainsMono Nerd Font Mono Medium
    position = 0, 60
    halign = center
    valign = center
}

# 4. Pastilla del Usuario / Icono
label {
    monitor =
    text = 󰄛  $USER
    color = $primary
    font_size = 14
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = 0, -15
    halign = center
    valign = center
}

# 5. Campo de entrada de contraseña (estilo pill con diseño de la shell)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    
    outer_color = $primary_dim
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    rounding = 14
    
    check_color = $success
    fail_color = $danger
    fail_text = <i><span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span></i>
    placeholder_text = <i><span foreground="##a6adc8">Introduce tu contraseña...</span></i>
    capslock_color = $warning
    
    position = 0, -80
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
}

# 6. Indicador de bloqueo / hint inferior
label {
    monitor =
    text = 󰌌  Presiona Enter para desbloquear
    color = $overlay
    font_size = 11
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 30
    halign = center
    valign = bottom
}
