# Configuración de tipografía
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Shell predeterminada
shell zsh

# Transparencia y espaciado
background_opacity 0.93
window_padding_width 10

# Include current theme from quickshell/mrdemonc
include ~/.local/state/mrdemonc/current/theme/kitty.conf

# Atajos de Portapapeles (Wayland / macOS style)
map super+c copy_to_clipboard
map super+x cut_to_clipboard
map super+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

