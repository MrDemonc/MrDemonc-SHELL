# ==============================================================================
#  MrDemonc-SHELL: Hypridle Configuration
# ==============================================================================

general {
    lock_cmd = shell-lock
    before_sleep_cmd = shell-lock
    after_sleep_cmd = shell-dpms on
}

# 1. Reducir brillo tras 2.5 minutos de inactividad
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 2. Bloquear la pantalla automáticamente tras 5 minutos
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Apagar la pantalla 15 segundos después de bloquearse
listener {
    timeout = 315
    on-timeout = shell-dpms off
    on-resume = shell-dpms on
}
