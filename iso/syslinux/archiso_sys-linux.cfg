LABEL arch
TEXT HELP
Boot the ARCH Linux install medium on BIOS.
It allows you to install ARCH Linux or perform system maintenance.
ENDTEXT
MENU LABEL ARCH Linux (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 udev.log_level=3 systemd.show_status=false rd.udev.log_level=3 vt.global_cursor_default=0 splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the ARCH Linux install medium on BIOS with speakup screen reader.
It allows you to install ARCH Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL ARCH Linux (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet loglevel=3 udev.log_level=3 systemd.show_status=false rd.udev.log_level=3 vt.global_cursor_default=0 splash
